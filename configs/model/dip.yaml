name: dip

# DiP encoder dimensions. d_model is the per-modality message feature size;
# q_dim is the shared dynamic pathway state size.
d_model: 256
q_dim: 256
n_q: 8
mp_hops: 3

# Modality-specific pseudo nodes.
n_pnode_v: 512
n_pnode_t: 64

dropout: 0.1
norm: true
fusion_type: path_integral

# DiP pseudo nodes are global mediators in the paper. NC training uses the
# complete message graph. The sampled LP adapter updates them over each
# LinkNeighborLoader subgraph during training, then over the full train graph
# for validation and final testing.
full_graph_training: true
lp_sampled_adapter_version: sampled_subgraph_v1

# null keeps the encoder output as concat([visual_state, text_state]), i.e. 2*q_dim.
# Set to an integer, e.g. 128, to add the official LP-style output projection.
embedding_dim: null

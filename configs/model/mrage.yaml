name: mrage

# Frozen MR-CGE V1.3-A Final Full values.
hidden_dim: 256
physical_hops: 3
semantic_hops: 1
num_experts: 4
top_k: 2
expert_bottleneck: 64
expert_eta: 0.1

dropout: 0.2
late_cross_dropout: 0.15
fusion_dropout: 0.2
balance_weight: 0.01

rho_init: 0.25
gamma_init: 0.08
beta_init: 0.25
same_node_enabled: true
semantic_knn_k: 8
nc_unimodal_weight: 0.3

eps: 1.0e-8
physical_chunk_size: 32768
semantic_chunk_size: 32768
cross_edge_chunk_size: 8192
attention_dim: 32
router_hidden_dim: 256
router_embed_dim: 8
channel_gate_hidden: 128

# LP's sampled semantic-source closure samples only the Train physical graph.
semantic_context_physical_fanout: [1, 1, 1]

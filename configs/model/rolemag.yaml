name: rolemag
lp_sampled_adapter_version: sampled_subgraph_v1

# RoleMAG encoder dimensions.
hidden_dim: 256
dropout: 0.2
backbone_num_layers: 3
shared_num_layers: 3
shared_edge_floor: 1.0
shared_fusion_weight: 1.0
role_residual_init: 0.1

# Factorized role router and expert settings.
router_hidden_dim: 64
topk_complementary: 16
num_queries: 4
lambda_bias: 1.0
eps: 1.0e-8
polyh2_init: [1.0, -0.5, 0.5]
beta_temperature: 1.5
confidence_scale: 1.25
role_prior_strength: 0.2
beta_floor: 0.5
beta_cap: 12.0

# RoleMAG paper objectives: evidential routing, role balance, and QCA.
lambda_evi: 0.1
out_edge_ratio: 0.05
eta_kl: 1.0
lambda_bal: 0.1
lambda_qca: 0.5
qca_max_nodes: 1024
tau: 0.07
# These implementation extensions are disabled; the comparison uses the
# paper's three stated auxiliary objectives only.
lambda_role_entropy: 0.0
lambda_gate_entropy: 0.0
lambda_u_center: 0.0
u_center_target: 0.35

# Role expert switches and schedule, matching RoleMAG's source defaults.
disable_router: false
disable_complementary: false
disable_directionality: false
disable_topk: false
disable_attention_bias: false
disable_heterophily: false
disable_gating: false
mix_hetero_into_shared: false
comp_warmup_epochs: 2
comp_ramp_epochs: 3
hetero_warmup_epochs: 4
hetero_ramp_epochs: 3
comp_schedule_scale: 1.0
hetero_schedule_scale: 0.75

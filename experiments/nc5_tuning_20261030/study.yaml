study_id: nc5_tuning_20261030
datasets:
- Movies
- Toys
- Grocery
- ele-fashion
- Reddit-S
representatives:
- Movies
- Grocery
- ele-fashion
selection_metric: mean_validation_accuracy
selection_note: Prefer one shared configuration; allow ele-fashion a separate configuration
  if three-seed validation supports it.
fashion_exception_min_gain_pp: 0.5
fashion_exception_min_seed_wins: 2
common_overrides: {}
strategy: Sequential one-parameter searches on representatives with seed42, then NC5
  validation and seeds42/43/44 confirmation. Test excluded from tuning.
parameter_schedule:
  training:
    task.lr:
    - 0.001
    - 0.0006
    - 0.0003
    task.weight_decay:
    - 1.0e-05
    - 0.0001
    - 0.001
    model.dropout:
    - 0.1
    - 0.2
    - 0.3
  relation_contributions:
    model.gamma_init:
    - 0.04
    - 0.08
    - 0.16
    - 0.25
    model.beta_init:
    - 0.05
    - 0.15
    - 0.25
    - 0.4
    model.rho_init:
    - 0.15
    - 0.25
    - 0.4
  routing_attention:
    model.router_hidden_dim:
    - 128
    - 256
    - 512
    model.attention_dim:
    - 16
    - 32
    - 64
    model.router_embed_dim:
    - 4
    - 8
    - 16
    model.channel_gate_hidden:
    - 64
    - 128
    - 256
  auxiliary_experts:
    model.nc_unimodal_weight:
    - 0.1
    - 0.3
    - 0.5
    model.balance_weight:
    - 0.001
    - 0.01
    - 0.03
    model.expert_bottleneck:
    - 32
    - 64
    - 128
    model.expert_eta:
    - 0.05
    - 0.1
    - 0.2
  representation_last:
    model.hidden_dim:
    - 128
    - 256
    - 512
candidates:
  baseline:
    description: Current MRAGE and NC task defaults.
    overrides: {}
  lr3e4:
    description: Hidden 256 with a lower learning rate.
    overrides:
      task:
        lr: 0.0003
  lr6e4:
    description: Change only learning rate to 0.0006.
    overrides:
      task:
        lr: 0.0006
  a01_weight_decay_1em05:
    description: Change only task.weight_decay to 1e-05 from baseline.
    stage: training
    anchor: baseline
    changed_parameter: task.weight_decay
    changed_value: 1.0e-05
    overrides:
      task:
        weight_decay: 1.0e-05
  a01_weight_decay_0p001:
    description: Change only task.weight_decay to 0.001 from baseline.
    stage: training
    anchor: baseline
    changed_parameter: task.weight_decay

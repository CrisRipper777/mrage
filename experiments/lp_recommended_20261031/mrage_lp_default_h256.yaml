model:
  name: mrage
  hidden_dim: 256
  physical_hops: 3
  semantic_hops: 1
  num_experts: 4
  top_k: 2
  expert_bottleneck: 64
  expert_eta: 0.1
  dropout: 0.2
  late_cross_dropout: 0.15
  fusion_dropout: 0.2
  balance_weight: 0.01
  rho_init: 0.25
  gamma_init: 0.08
  beta_init: 0.25
  same_node_enabled: true
  semantic_knn_k: 8
  nc_unimodal_weight: 0.3
  eps: 1.0e-08
  physical_chunk_size: 32768
  semantic_chunk_size: 32768
  cross_edge_chunk_size: 8192
  attention_dim: 32
  router_hidden_dim: 256
  router_embed_dim: 8
  channel_gate_hidden: 128
  semantic_context_physical_fanout:
  - 1
  - 1
  - 1
task:
  name: lp
  protocol_version: unified_sampled_lp_v1
  training_mode: sampled
  optimizer: adam
  epochs: 150
  lr: 0.001
  weight_decay: 1.0e-05
  patience: 10
  early_stop_min_epoch: 20
  early_stop_min_delta: 0.0001
  grad_clip: 1.0
  batch_size: 2048
  num_neighbors:
  - 5
  - 5
  - 5
  subgraph_type: bidirectional
  num_train_neg: 1
  positive_edge_mask_backend: global_eid
  loader_num_workers: 4
  loader_prefetch_factor: 2
  torch_threads: 8
  negative_seed_offset: 10000
  shuffle_seed_offset: 20000
  neighbor_seed_offset: 30000
  inference_mode: full
  inference_batch_size: 4096
  eval_preload_node_emb: true
  eval_every: 2
  max_train_batches: null
  train_pos_per_epoch: null
  eval_edge_batch_size: 512
  profile_timing: false
  loss:
    aux_weight: 1.0
  decoder:
    name: mlp
    hidden_dim: 256
    num_layers: 3
    dropout: 0.02
    proj_dim: 128
  save_ckpt_path: null
  evaluate_test: true
  phase: train
  checkpoint_path: null
  validation_metrics_path: null
  final_test_metrics_path: null
  paper_run_status_path: null

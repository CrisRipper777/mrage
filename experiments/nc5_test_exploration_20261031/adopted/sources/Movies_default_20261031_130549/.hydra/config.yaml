dataset:
  name: Movies
  source: magb
  tasks:
  - nc
  - lp
  graph_path: ${paths.data_root}/Movies/MoviesGraph.pt
  text_feat_path: ${paths.data_root}/Movies/TextFeature/Movies_roberta_base_512_mean.npy
  image_feat_path: ${paths.data_root}/Movies/ImageFeature/Movies_openai_clip-vit-large-patch14.npy
  num_classes: 20
  feature_dtype: float32
  make_undirected: true
  add_self_loops: false
  nc_split_path: ${paths.split_root}/Movies_nc_seed${dataset_split_seed}_train0.6_val0.2.pt
  lp_split_path: ${paths.split_root}/Movies_lp_seed${seed}_val0.2_test0.2_neg150_filtered1.pt
  nc_train_ratio: 0.6
  nc_val_ratio: 0.2
  lp_val_ratio: 0.2
  lp_test_ratio: 0.2
  lp_num_neg: 150
  lp_split_undirected: true
  auto_generate_splits: false
task:
  name: nc
  protocol_version: unified_full_graph_nc_v1
  training_mode: full_graph
  optimizer: adamw
  epochs: 300
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 1024
  num_neighbors: 15
  inference_mode: full
  inference_batch_size: 4096
  eval_every: 1
  patience: 30
  early_stop_min_epoch: 30
  early_stop_min_delta: 0.0001
  grad_clip: 1.0
  max_train_batches: null
  save_ckpt_path: null
  run_metrics_path: null
  scheduler: null
  scheduler_warmup_epochs: 10
  scheduler_min_lr: 1.0e-05
  loss:
    aux_weight: 1.0
    unimodal_weight: ${oc.select:model.nc_unimodal_weight,0.0}
    class_balanced_main_ce: false
  evaluate_test: true
  macro_f1_labels: all_classes
  phase: train
  mask_test_labels: false
  checkpoint_path: null
  validation_metrics_path: null
  final_test_metrics_path: null
  paper_run_status_path: null
  edge_index_override_path: null
model:
  name: mrage
  hidden_dim: 256
  physical_hops: 3
  semantic_hops: 1
  num_experts: 4
  top_k: 2
  expert_bottleneck: 64
  expert_eta: 0.1
  dropout: 0.2
  late_cross_dropout: 0.15
  fusion_dropout: 0.2
  balance_weight: 0.01
  rho_init: 0.25
  gamma_init: 0.08
  beta_init: 0.25
  same_node_enabled: true
  semantic_knn_k: 8
  nc_unimodal_weight: 0.3
  eps: 1.0e-08
  physical_chunk_size: 32768
  semantic_chunk_size: 32768
  cross_edge_chunk_size: 8192
  attention_dim: 32
  router_hidden_dim: 256
  router_embed_dim: 8
  channel_gate_hidden: 128
  semantic_context_physical_fanout:
  - 1
  - 1
  - 1
seed: 42
num_runs: 3
dataset_split_seed: 42
device: cuda:1
paths:
  data_root: ${oc.env:MRAGE_DATA_ROOT,/hdd1/DataInHere/YHF/data}
  split_root: ${oc.env:MRAGE_SPLIT_ROOT,${paths.data_root}/MAGB_split}
  output_root: outputs
  semantic_cache_root: artifacts/semantic_graphs
semantic_graph:
  mode: auto
  knn_k: 8
  cache_dir: ${paths.semantic_cache_root}
  validate: true
  faiss_seed: 2026
  faiss_threads: 8
  resolved_cache_path: null
  identity_fingerprint: null
  feature_fingerprint: null
  candidate_fingerprint: null
  v7b_fingerprint: null
logging:
  level: INFO
